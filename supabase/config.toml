# Visionary — Supabase CLI config (functions only; auth settings live in the dashboard, see SECURITY.md)

[functions.ai-suggest]
enabled = true
# Gateway rejects requests without a valid JWT. The function additionally
# verifies it's a real signed-in user (the anon key alone is not enough).
verify_jwt = true
import_map = "./functions/ai-suggest/deno.json"
entrypoint = "./functions/ai-suggest/index.ts"

[functions.account]
enabled = true
verify_jwt = true
import_map = "./functions/account/deno.json"
entrypoint = "./functions/account/index.ts"
